<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Бібліотека Хормейстера</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link rel="icon" href="assets/icon.png" />
  <link rel="stylesheet" href="style.css" />
  <style>
    body {
      transition: background-color 0.3s ease, color 0.3s ease;
    }
  </style>
</head>

<body class="bg-gray-50 text-gray-900 dark:bg-gray-900 dark:text-gray-100">

  <!-- 🔹 Верхня частина -->
  <header class="p-6 text-center bg-white dark:bg-gray-800 shadow-md">
    <h1 class="text-4xl font-bold mb-1">📚 Бібліотека Хормейстера</h1>
    <p class="text-gray-500 dark:text-gray-400 text-lg">
      Музично-хорова література та навчальні матеріали
    </p>
  </header>
  
  <!-- 🔹 Пошук -->
  <section class="p-6 max-w-4xl mx-auto">
    <input id="search"
           type="text"
           placeholder="🔍 Пошук за автором чи назвою..."
           class="w-full p-3 border rounded-lg dark:bg-gray-800 dark:border-gray-700 focus:outline-none focus:ring-2 focus:ring-blue-500">
    <!-- 🔹 Фільтри -->
    <div class="p-4">
      <!-- Кнопка спойлера для мобільних -->
      <button id="toggleFiltersBtn"
              class="sm:hidden w-full bg-blue-500 text-white px-4 py-2 rounded-lg mb-2 text-left flex justify-between items-center">
        Фільтри 
        <span id="toggleArrow">▼</span>
      </button>
    
      <!-- Контейнер фільтрів -->
      <div id="filtersContainer" class="max-h-0 overflow-hidden transition-all duration-300 sm:max-h-none sm:block">
        <!-- Кнопки категорій -->
        <div id="categoryButtons" class="flex flex-wrap gap-2 mb-2"></div>
        <!-- Алфавітний покажчик -->
        <div id="alphabetButtons" class="flex flex-nowrap sm:flex-wrap gap-2 overflow-x-auto py-1 px-2"></div>
      </div>
    </div>
  </section>

  <!-- 🔹 Основна бібліотека -->
  <main class="p-6">
    <div id="booksContainer" class="grid grid-cols-1 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4"></div>

    <!-- Пагінація -->
    <div id="pagination" class="flex justify-center mt-6 gap-2"></div>
  </main>
    
  <!-- 🔹 Модальне вікно детальної картки книги -->
  <div id="bookModal" class="fixed inset-0 bg-black/50 hidden items-center justify-center z-50 p-4">
    <div class="bg-white dark:bg-gray-900 w-full max-w-3xl rounded-lg shadow-lg relative overflow-hidden max-h-[90vh]">
      <!-- Кнопка закриття -->
      <button onclick="closeBookModal()" class="absolute top-2 right-2 text-white bg-red-600 rounded-full w-8 h-8 flex items-center justify-center hover:bg-red-700">✕</button>
  
        <div class="flex flex-col md:flex-row gap-6 p-6 overflow-y-auto">
          <!-- Обкладинка -->
          <div class="flex-shrink-0 w-full md:w-1/3">
            <img id="modalCover" src="" alt="cover" class="w-full h-auto aspect-[3/4] object-cover rounded border border-gray-300 dark:border-gray-700">
          </div>
    
          <!-- Інформація про книгу -->
          <div class="flex-1 flex flex-col gap-3 min-w-0">
            <h2 id="modalTitle" class="text-xl font-bold break-words"></h2>
            <div id="modalSize" class="text-gray-500"></div>
    
          <!-- Коротке посилання -->
          <div class="flex items-center gap-2 truncate">
            <span class="font-medium">Коротке посилання:</span>
            <span id="modalShortUrl" class="text-blue-600 dark:text-blue-400 underline truncate cursor-pointer" title=""></span>
            <button onclick="copyToClipboard('modalShortUrl')" class="px-2 py-1 bg-gray-200 dark:bg-gray-700 rounded hover:bg-gray-300 dark:hover:bg-gray-600" title="Скопіювати">📋</button>
          </div>
          
          <!-- Посилання на картку -->
          <div class="flex items-center gap-2 truncate">
            <span class="font-medium">Посилання на картку:</span>
            <span id="modalPageUrl" class="text-blue-600 dark:text-blue-400 underline truncate cursor-pointer" title=""></span>
            <button onclick="copyToClipboard('modalPageUrl')" class="px-2 py-1 bg-gray-200 dark:bg-gray-700 rounded hover:bg-gray-300 dark:hover:bg-gray-600" title="Скопіювати">📋</button>
          </div>
          
          <!-- Категорії книги -->
          <div class="flex flex-wrap items-center gap-2">
            <span class="font-medium">Категорії:</span>
            <div id="modalKeywords" class="flex flex-wrap gap-x-2 gap-y-1 text-gray-700 dark:text-gray-300"></div>
          </div>
  
          <!-- Кнопки Переглянути і Завантажити -->
          <div class="flex gap-2 mt-auto flex-wrap">
            <button id="modalViewBtn" class="px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700 text-sm flex-1">📖 Переглянути</button>
            <button id="modalDownloadBtn" class="px-4 py-2 bg-green-600 text-white rounded hover:bg-green-700 text-sm flex-1">⬇️ Завантажити</button>
          </div>
        </div>
      </div>
    </div>
  </div>


  <!-- 🔹 Модальне вікно для перегляду PDF -->
  <div id="pdfModal" class="fixed inset-0 bg-black/50 hidden items-center justify-center z-50">
    <div class="bg-white dark:bg-gray-900 w-11/12 max-w-3xl h-[80vh] rounded-lg shadow-lg relative">
      <button onclick="closePDF()" class="absolute top-2 right-2 text-white bg-red-600 rounded-full w-8 h-8 flex items-center justify-center hover:bg-red-700">✕</button>
      <iframe id="pdfViewer" src="" class="w-full h-full rounded-lg" style="border:none;"></iframe>
    </div>
  </div>

  <!-- 🔹 Футер -->
  <footer class="p-6 text-center text-sm bg-gray-100 dark:bg-gray-800">
    © 2026 Бібліотека Хормейстера | horlibua
  </footer>

  <script src="script.js"></script>
  <!-- 100% privacy-first analytics -->
  <script data-collect-dnt="true" async src="https://scripts.simpleanalyticscdn.com/latest.js"></script>

</body>
</html>
